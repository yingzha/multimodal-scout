services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: multimodal_scout
      POSTGRES_USER: scout_user
      POSTGRES_PASSWORD: scout_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout_user -d multimodal_scout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    command: >
      sh -c "
        echo 'Database ready. Starting FastAPI server...' &&
        python -m uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 --reload
      "

  # Cron service removed - using backend /pipeline endpoint with manual triggers in local dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data: