# Cloud Scheduler Jobs Configuration
# Pipeline job includes scraping, so only one job needed

# Pipeline job - runs every 30 minutes for fresh content processing
apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: pipeline-job
spec:
  schedule: "*/30 * * * *"  # Every 30 minutes for fresh content
  timeZone: "UTC"
  httpTarget:
    uri: https://multimodal-scout-backend-${PROJECT_ID}.${REGION}.run.app/pipeline
    httpMethod: POST
    oidcToken:
      serviceAccountEmail: multimodal-scout-scheduler@${PROJECT_ID}.iam.gserviceaccount.com