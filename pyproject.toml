[project]
name = "multimodal-scout"
version = "0.1.0"
description = "A multimodal content scouting system with AI-powered summarization"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.3",
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1",
    "pylint>=4.1.2",
    "httpx2>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
