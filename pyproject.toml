[project]
name = "multimodal-scout"
version = "0.1.0"
description = "A multimodal content scouting system with AI-powered summarization"
dependencies = [
    "pydantic[email]>=2.11.7",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "feedparser>=6.0.0",
    "google-genai",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
    "bcrypt>=4.3.0",
    "email-validator>=2.3.0",
    "google-cloud-secret-manager>=2.16.0",
    "cloud-sql-python-connector[pg8000]>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "black>=25.1.0",
    "pylint>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
