# Google Cloud Build configuration
steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/multimodal-scout-backend:$BUILD_ID', '-f', 'Dockerfile.backend', '.']
  
  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/multimodal-scout-frontend:$BUILD_ID', '-f', 'Dockerfile.frontend.prod', '.']
  
  # Build cron image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/multimodal-scout-cron:$BUILD_ID', '-f', 'Dockerfile.cron', '.']

  # Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/multimodal-scout-backend:$BUILD_ID']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/multimodal-scout-frontend:$BUILD_ID']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/multimodal-scout-cron:$BUILD_ID']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'multimodal-scout-backend', 
           '--image', 'gcr.io/$PROJECT_ID/multimodal-scout-backend:$BUILD_ID',
           '--region', 'us-central1',
           '--platform', 'managed',
           '--allow-unauthenticated',
           '--port', '8000',
           '--memory', '2Gi',
           '--cpu', '2',
           '--max-instances', '10',
           '--set-env-vars', 'DATABASE_URL=postgresql://$$DATABASE_USER:$$DATABASE_PASSWORD@/$$DATABASE_NAME?host=/cloudsql/$$PROJECT_ID:us-central1:$$DATABASE_INSTANCE',
           '--add-cloudsql-instances', '$$PROJECT_ID:us-central1:$$DATABASE_INSTANCE']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'multimodal-scout-frontend',
           '--image', 'gcr.io/$PROJECT_ID/multimodal-scout-frontend:$BUILD_ID',
           '--region', 'us-central1',
           '--platform', 'managed',
           '--allow-unauthenticated',
           '--port', '3000',
           '--memory', '1Gi',
           '--cpu', '1',
           '--max-instances', '5']

  # Deploy cron service to Cloud Run (for scheduled tasks)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'multimodal-scout-cron',
           '--image', 'gcr.io/$PROJECT_ID/multimodal-scout-cron:$BUILD_ID',
           '--region', 'us-central1',
           '--platform', 'managed',
           '--no-allow-unauthenticated',
           '--memory', '2Gi',
           '--cpu', '2',
           '--max-instances', '1',
           '--set-env-vars', 'DATABASE_URL=postgresql://$$DATABASE_USER:$$DATABASE_PASSWORD@/$$DATABASE_NAME?host=/cloudsql/$$PROJECT_ID:us-central1:$$DATABASE_INSTANCE',
           '--add-cloudsql-instances', '$$PROJECT_ID:us-central1:$$DATABASE_INSTANCE']

substitutions:
  _DATABASE_INSTANCE: 'multimodal-scout-db'
  _DATABASE_NAME: 'multimodal_scout'
  _DATABASE_USER: 'scout_user'

images:
  - 'gcr.io/$PROJECT_ID/multimodal-scout-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/multimodal-scout-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/multimodal-scout-cron:$BUILD_ID'