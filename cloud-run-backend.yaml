apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: multimodal-scout-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # Auto-scaling configuration for cost optimization
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # CPU allocation optimized for low traffic
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: multimodal-scout-backend@PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: gcr.io/PROJECT_ID/multimodal-scout-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: PROJECT_ID
        - name: DB_USER
          value: scout_user
        - name: DB_NAME
          value: multimodal_scout
        - name: INSTANCE_CONNECTION_NAME
          value: PROJECT_ID:REGION:multimodal-scout-db
        resources:
          limits:
            # Minimal resources for cost optimization
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      timeout: 300s