services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: multimodal_scout
      POSTGRES_USER: scout_user
      POSTGRES_PASSWORD: scout_password
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout_user -d multimodal_scout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "
        echo 'Database ready. Starting FastAPI server...' &&
        uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 --reload
      "

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/app/src
    command: >
      sh -c "
        while true; do
          python -m src.backend.run_pipeline;
          sleep $${PIPELINE_INTERVAL_SECONDS:-1800};
        done
      "

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ../.env
    volumes:
      - ../src/frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres18_data:
