services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: multimodal_scout
      POSTGRES_USER: scout_user
      POSTGRES_PASSWORD: scout_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout_user -d multimodal_scout"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    command: >
      sh -c "
        echo 'Database ready. Starting FastAPI server...' &&
        uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 --reload
      "

  cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ../.env
    volumes:
      - ../src:/app/src
      - ../crontab:/etc/cron.d/multimodal-scout
      - ../gcloud/cron_env.sh:/app/cron_env.sh
      - cron_logs:/var/log
    command: >
      sh -c "
        echo '🕐 Starting cron service...' &&
        apt-get update -qq && apt-get install -y -qq cron &&
        chmod 0644 /etc/cron.d/multimodal-scout &&
        chmod +x /app/cron_env.sh &&
        mkdir -p /var/log && touch /var/log/cron.log &&
        crontab /etc/cron.d/multimodal-scout &&
        echo '✅ Pipeline will run every 30 minutes' &&
        cron && tail -f /var/log/cron.log
      "

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    volumes:
      - ../src/frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  cron_logs: